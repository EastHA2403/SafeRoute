<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SafeRoute PM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid"><span class="navbar-brand mb-0 h1">SafeRoute PM</span></div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-3 p-3 border-end">
        <form id="route-form">
          <div class="mb-2"><label class="form-label">출발지 (위도, 경도)</label>
            <input id="origin" class="form-control" value="37.5660,126.9780" /></div>
          <div class="mb-3"><label class="form-label">도착지 (위도, 경도)</label>
            <input id="destination" class="form-control" value="37.5680,126.9800" /></div>
          <button class="btn btn-primary w-100" type="submit">안전 경로 탐색</button>
        </form>
        <div id="result" class="mt-3"></div>
      </aside>
      <main class="col-md-9 p-0"><div id="map"></div></main>
    </div>
  </div>

  <!-- TODO: 카카오 개발자 콘솔에서 JavaScript 키 발급 후 YOUR_APP_KEY 교체 -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
